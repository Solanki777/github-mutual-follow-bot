name: GitHub Mutual Follow Sync

on:
  workflow_dispatch:

  # Enable daily automation after the first successful test:
  # schedule:
  #   - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Mutual Follow Bot
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python main.py